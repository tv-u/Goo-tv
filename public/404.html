<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CineSphere VIP</title>
  <script>
    // GitHub Pages SPA router redirect:
    // Takes the current location and redirects to root index.html with the route encoded in query/hash
    var pathSegmentsToKeep = 0;
    var l = window.location;
    var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
      encodeURIComponent(l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/')) +
      (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
      l.hash;
    l.replace(target);
  </script>
</head>
<body style="background:#0b0c10;color:#fff;font-family:sans-serif;text-align:center;padding:50px;">
  <p>Redirecting to CineSphere VIP Cinema...</p>
</body>
</html>
