    <!-- Fail-Safe Cinema Loader Watchdog -->
    <script>
      (function() {
        // Global unhandled error recovery
        window.addEventListener('error', function(e) {
          console.warn('System notice caught:', e.message);
        });

        // Watchdog to reveal enter cinema button if network is slow
        setTimeout(function() {
          var action = document.getElementById('app-loader-action');
          if (action) action.style.display = 'block';
        }, 3000);
      })();
