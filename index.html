    <!-- Fail-Safe Cinema Loader Watchdog (Only on Unbuilt Static Hosts if React Fails) -->
    <script>
      (function() {
        var hostname = window.location.hostname || '';
        var isDev = hostname === 'localhost' || hostname === '127.0.0.1' || window.location.port === '3000' || window.location.port === '5173' || hostname.indexOf('ais-') !== -1;

        // If raw .tsx fails to execute on raw uncompiled hosts
        window.addEventListener('error', function(e) {
          if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.indexOf('main.tsx') !== -1) {
            console.warn('Raw TSX not supported by host, loading standalone cinema fallback.');
            window.location.replace('./standalone.html' + (window.location.search || '') + (window.location.hash || ''));
          }
        }, true);

        // Safe Watchdog: If React hasn't mounted in 4.5 seconds on uncompiled static host, load fallback
        if (!isDev) {
          setTimeout(function() {
            var root = document.getElementById('root');
            if (root && root.querySelector('#app-loading-fallback')) {
              var target = './standalone.html' + (window.location.search || '') + (window.location.hash || '');
              window.location.replace(target);
            }
          }, 4500);
        }
      })();
    </script>
